name: Cloud Python Automation

on:
  schedule:
    - cron: '0 8 * * *' # Yeh roz subah 8 baje UTC par chalay gi
  workflow_dispatch: # Isse tum button daba kar manual bhi run kar sako ge

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Yeh zaroori hai taake script file ko wapas repo mein save kar sake
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Python Script
        run: |
          python main.py

      - name: Commit and push changes back to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add automation_log.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update automation log" && git push)
